<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>avacadolphin — a little warmth, every visit</title>
  <meta name="description" content="A small dose of positivity every time you visit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-light: #e8f5ee;
      --green-mid: #7ec8a0;
      --green-dark: #3a7a55;
      --amber-light: #fef8ed;
      --amber-mid: #f0c97a;
      --amber-dark: #8a5e10;
      --blue-light: #edf5fc;
      --blue-mid: #87bfde;
      --blue-dark: #1f5f8a;
      --text-primary: #2c2c2a;
      --text-secondary: #5f5e5a;
      --text-tertiary: #888780;
      --bg: #fdfcf8;
      --card-bg: #ffffff;
      --border: rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f0ede6;
        --text-secondary: #b4b2a9;
        --text-tertiary: #888780;
        --bg: #1a1a18;
        --card-bg: #242420;
        --border: rgba(255,255,255,0.09);
        --green-light: #0e2b1a;
        --amber-light: #2a1f06;
        --blue-light: #0b1e2d;
      }
    }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
      position: relative;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      opacity: 0.18;
    }
    .blob1 { width: 400px; height: 400px; background: var(--green-mid); top: -100px; left: -120px; }
    .blob2 { width: 320px; height: 320px; background: var(--amber-mid); bottom: -80px; right: -80px; }
    .blob3 { width: 220px; height: 220px; background: var(--blue-mid); top: 45%; left: 65%; }
    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }
    .site-name {
      font-family: 'Lora', Georgia, serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 2.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.8rem 2.5rem 2.2rem;
      width: 100%;
      text-align: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card.fade-out {
      opacity: 0;
      transform: translateY(10px);
    }
    .deco {
      font-size: 36px;
      display: block;
      margin-bottom: 1.2rem;
      line-height: 1;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }
    .badge-quote  { background: var(--green-light); color: var(--green-dark); border: 1px solid rgba(126,200,160,0.3); }
    .badge-prompt { background: var(--amber-light); color: var(--amber-dark); border: 1px solid rgba(240,201,122,0.35); }
    .badge-fact   { background: var(--blue-light);  color: var(--blue-dark);  border: 1px solid rgba(135,191,222,0.3); }
    .main-text {
      font-family: 'Lora', Georgia, serif;
      font-size: 21px;
      line-height: 1.7;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 1.2rem;
    }
    .source {
      font-size: 13px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-tertiary);
      letter-spacing: 0.03em;
    }
    /* Loading shimmer */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    .shimmer {
      background: linear-gradient(90deg, var(--border) 25%, rgba(0,0,0,0.04) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .shimmer {
        background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.06) 75%);
        background-size: 200% 100%;
      }
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .shimmer-line { height: 16px; width: 80%; }
    .shimmer-line.short { width: 50%; height: 13px; }
    .shimmer-line.long  { width: 90%; }
    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-next {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 9px 22px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .btn-next:hover {
      background: var(--green-light);
      border-color: rgba(126,200,160,0.4);
      color: var(--green-dark);
    }
    .btn-next:active { transform: scale(0.97); }
    .btn-next:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .btn-share {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 9px 18px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-share:hover {
      background: var(--blue-light);
      border-color: rgba(135,191,222,0.4);
      color: var(--blue-dark);
    }
    .btn-share:active { transform: scale(0.97); }
    .btn-share.copied {
      background: var(--green-light);
      border-color: rgba(126,200,160,0.4);
      color: var(--green-dark);
    }
    .dot-nav { display: flex; gap: 7px; align-items: center; }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
      border: 1px solid var(--text-tertiary);
      opacity: 0.3;
      transition: opacity 0.3s, transform 0.3s;
    }
    .dot.active { opacity: 1; transform: scale(1.3); background: var(--text-tertiary); }
    .tagline {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-tertiary);
      margin-top: 2.2rem;
      letter-spacing: 0.07em;
    }
    @media (max-width: 480px) {
      .main-text { font-size: 18px; }
      .card { padding: 2rem 1.5rem 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="wrapper">
    <div class="site-name">avacadolphin</div>
    <div class="card" id="card">
      <!-- Populated by JS -->
    </div>
    <div class="actions">
      <div class="dot-nav" id="dots"></div>
      <button class="btn-share" id="btn-share" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        share
      </button>
      <button class="btn-next" id="btn-next" disabled>another one →</button>
    </div>
    <p class="tagline">a small dose of warmth, every visit</p>
  </div>

  <script>
    // ── Config ──────────────────────────────────────────────────────────────
    const QUOTE_DECOS  = ['🌱','🌸','🌊','☁️','🌻','🌿','🥑','🐬'];
    const FACT_DECOS   = ['🐬','🌊','🌿','🥑','✨','🔭','🌍'];
    const PROMPT_DECOS = ['✉️','☀️','💌','🌙','🕯️','🌻','🫧'];

    const nudges = [
      { deco: "✉️", text: "Think of someone who made you smile this week. Take a moment to let them know.", source: "a gentle nudge" },
      { deco: "☀️", text: "Name three things, however small, that went right today.", source: "a little reflection" },
      { deco: "💌", text: "Write down one kind thing you'd say to a friend who was having your exact day.", source: "a gentle nudge" },
      { deco: "🌙", text: "Before you sleep tonight, think of one person you're grateful to have in your life.", source: "a gentle nudge" },
      { deco: "🌻", text: "Step outside for two minutes, even just to feel the air. That counts.", source: "a gentle nudge" },
      { deco: "🕯️", text: "Do one small thing today purely because it makes you happy — no reason needed.", source: "a gentle nudge" },
      { deco: "🫧", text: "Take three slow breaths. You don't need to earn rest.", source: "a gentle nudge" },
      { deco: "💛", text: "Send a message to someone you haven't spoken to in a while. They'll appreciate it.", source: "a gentle nudge" },
      { deco: "🌿", text: "Drink a glass of water. Small things add up.", source: "a gentle nudge" },
      { deco: "✨", text: "Celebrate one tiny win from today — even if nobody else noticed.", source: "a gentle nudge" },
    ];

    const badgeClass = { quote: "badge-quote", prompt: "badge-prompt", fact: "badge-fact" };
    const badgeLabel = { quote: "quote", prompt: "gentle nudge", fact: "fun fact" };

    // ── State ────────────────────────────────────────────────────────────────
    let count = 0;
    const DOTS = 5;

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const cardEl    = document.getElementById("card");
    const dotsEl    = document.getElementById("dots");
    const btnNext   = document.getElementById("btn-next");
    const btnShare  = document.getElementById("btn-share");
    let currentMoment = null;

    // ── Fetchers ─────────────────────────────────────────────────────────────
    async function fetchQuote() {
      const res = await fetch("https://api.quotable.io/random?tags=inspirational|happiness|mindfulness|life|friendship");
      if (!res.ok) throw new Error("quote fetch failed");
      const data = await res.json();
      const deco = QUOTE_DECOS[Math.floor(Math.random() * QUOTE_DECOS.length)];
      return { type: "quote", deco, text: data.content, source: `— ${data.author}` };
    }

    async function fetchFact() {
      const res = await fetch("https://uselessfacts.jsph.pl/api/v2/facts/random?language=en");
      if (!res.ok) throw new Error("fact fetch failed");
      const data = await res.json();
      const deco = FACT_DECOS[Math.floor(Math.random() * FACT_DECOS.length)];
      return { type: "fact", deco, text: data.text, source: "a fun fact" };
    }

    function getRandomNudge() {
      const nudge = nudges[Math.floor(Math.random() * nudges.length)];
      return { type: "prompt", ...nudge };
    }

    // Fallback quotes in case API is down
    const fallbackQuotes = [
      { type: "quote", deco: "🌱", text: "You are allowed to be both a masterpiece and a work in progress, simultaneously.", source: "— Sophia Bush" },
      { type: "quote", deco: "🥑", text: "Be somebody who makes everybody feel like a somebody.", source: "— Kid President" },
      { type: "quote", deco: "🌊", text: "Even the darkest night will end, and the sun will rise.", source: "— Victor Hugo" },
      { type: "quote", deco: "🌸", text: "Start where you are. Use what you have. Do what you can.", source: "— Arthur Ashe" },
    ];

    async function getNextMoment() {
      const roll = Math.random();
      if (roll < 0.45) {
        try { return await fetchQuote(); }
        catch { return fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)]; }
      } else if (roll < 0.75) {
        try { return await fetchFact(); }
        catch { return getRandomNudge(); }
      } else {
        return getRandomNudge();
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function showLoading() {
      cardEl.innerHTML = `
        <div class="loading-wrap">
          <div class="shimmer shimmer-line short"></div>
          <div class="shimmer shimmer-line long"></div>
          <div class="shimmer shimmer-line"></div>
          <div class="shimmer shimmer-line short"></div>
        </div>`;
    }

    function showMoment(m) {
      currentMoment = m;
      cardEl.innerHTML = `
        <span class="deco">${m.deco}</span>
        <span class="badge ${badgeClass[m.type]}">${badgeLabel[m.type]}</span>
        <p class="main-text">${m.text}</p>
        <p class="source">${m.source}</p>`;
      btnShare.style.display = "flex";
    }

    function buildDots() {
      dotsEl.innerHTML = "";
      const shown = Math.min(count, DOTS);
      for (let i = 0; i < shown; i++) {
        const d = document.createElement("div");
        d.className = "dot" + (i === shown - 1 ? " active" : "");
        dotsEl.appendChild(d);
      }
    }

    async function loadNext() {
      btnNext.disabled = true;
      cardEl.classList.add("fade-out");
      await new Promise(r => setTimeout(r, 300));
      showLoading();
      cardEl.classList.remove("fade-out");
      const moment = await getNextMoment();
      cardEl.classList.add("fade-out");
      await new Promise(r => setTimeout(r, 200));
      showMoment(moment);
      count++;
      buildDots();
      cardEl.classList.remove("fade-out");
      btnNext.disabled = false;
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    (async () => {
      showLoading();
      const moment = await getNextMoment();
      showMoment(moment);
      count = 1;
      buildDots();
      btnNext.disabled = false;
    })();

    btnNext.addEventListener("click", loadNext);

    btnShare.addEventListener("click", async () => {
      if (!currentMoment) return;
      const shareText = `${currentMoment.text} ${currentMoment.source}`;
      const shareData = {
        title: "avacadolphin",
        text: shareText,
        url: window.location.href,
      };
      if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
        // Mobile: native share sheet
        try { await navigator.share(shareData); } catch (_) {}
      } else {
        // Desktop: copy to clipboard
        try {
          await navigator.clipboard.writeText(`${shareText}\n\n${window.location.href}`);
          btnShare.classList.add("copied");
          btnShare.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> copied!`;
          setTimeout(() => {
            btnShare.classList.remove("copied");
            btnShare.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> share`;
          }, 2000);
        } catch (_) {}
      }
    });
  </script>
</body>
</html>
